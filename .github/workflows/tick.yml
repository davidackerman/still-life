name: tick

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub may delay or drop scheduled runs; each run catches up
  workflow_dispatch:
    inputs:
      force_thumbnail:
        description: "Upload a fresh thumbnail this run"
        type: boolean
        default: false
      force_pinned:
        description: "Rewrite the pinned status comments now (if their text changed)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write  # alerts: an issue when the universe gets stuck, is saved or dies

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    # Off until the owner sets the repository variable TICK_ENABLED=true (after
    # the secrets exist). Also keeps forks from running it.
    if: vars.TICK_ENABLED == 'true' && github.repository == 'davidackerman/still-life'
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # a death renders the obituary (a few minutes)
    env:
      # The death sequence never uploads or changes privacy while "true": it
      # renders the obituary, attaches it to the run, and stops. The owner
      # changes this by hand.
      DRY_RUN: "true"
      DAILY_SHORT: ${{ vars.DAILY_SHORT || 'off' }}  # off | dry | live: a recap Short each evening (daily.py)
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch as it is when this job starts, not the commit it was queued
          # with: a run that waited (concurrency) for another must start from that
          # run's saved state, or its own save conflicts with it.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt  # numpy pillow google-api-python-client google-auth

      - name: Does this run render a video (obituary or daily Short)?
        id: death
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os
          s = json.load(open("state/state.json"))
          stage = (s.get("death") or {}).get("stage")
          dry = os.environ["DRY_RUN"].strip().lower() == "true"
          obituary = (s["universe"]["phase"] == "DIED" and stage not in ("halted", "processing", "launch")
                      and not (dry and stage == "dry_run_done"))
          now = dt.datetime.now(dt.timezone.utc)
          daily = (os.environ["DAILY_SHORT"].strip().lower() in ("dry", "live") and now.hour >= 23
                   and s["universe"]["phase"] != "DIED"
                   and (s.get("daily") or {}).get("date") != now.date().isoformat())
          print(f"render={'true' if obituary or daily else 'false'}")
          EOF

      - name: Install ffmpeg
        if: steps.death.outputs.render == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Tick
        run: python tick.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          VIDEO_ID: ${{ secrets.VIDEO_ID }}
          EXTRA_VIDEO_IDS: ${{ secrets.EXTRA_VIDEO_IDS }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          FORCE_THUMBNAIL: ${{ inputs.force_thumbnail || 'false' }}
          FORCE_PINNED: ${{ inputs.force_pinned || 'false' }}
          PINNED_LINK: ${{ vars.PINNED_LINK || 'true' }}

      - name: Commit state
        run: |
          git config user.name "still-life bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state archive
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -m "tick: $(python -c "import json; s=json.load(open('state/state.json')); u=s['universe']; print(f\"universe {s['config'].get('universe', 1)} gen {u['generation']} {u['phase']}\")")"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "push failed" && exit 1

      - name: Attach the obituary
        if: hashFiles('out/obituary.mp4') != ''
        uses: actions/upload-artifact@v7
        with:
          name: obituary
          path: out/obituary.mp4
          retention-days: 90

      - name: Attach the daily Short
        if: hashFiles('out/daily.mp4') != ''
        uses: actions/upload-artifact@v7
        with:
          name: daily-short
          path: out/daily.mp4
          retention-days: 30

      - name: Alerts
        if: hashFiles('out/alerts.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python alerts.py post out/alerts.json
