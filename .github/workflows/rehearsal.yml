name: rehearsal

# Manual only. Kills a scratch universe and runs the real death sequence in
# dry-run mode on GitHub's runner, without secrets or YouTube: checks that the
# obituary renders here (fonts, ffmpeg, time). Download it from the run's artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: python rehearse.py
      - uses: actions/upload-artifact@v7
        with:
          name: rehearsal-obituary
          path: out/obituary.mp4
          retention-days: 14
